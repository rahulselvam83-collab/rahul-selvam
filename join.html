<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join NEXUS</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">NEXUS<span>.</span></a><nav class="links"><a href="index.html">Home</a><a href="status.html">Application status</a></nav></div></header><main class="wrap"><section class="hero"><div class="eyebrow">BECOME PART OF THE JOURNEY</div><h1>Join <span>NEXUS.</span></h1><p class="muted">Share your interests, skills and what you'd like to learn or contribute.</p></section><section class="section panel"><form id="f" class="form"><div class="row"><div class="field"><label>Full name *</label><input id="name" required maxlength="80"></div><div class="field"><label>Email *</label><input id="email" type="email" required maxlength="120"></div></div><div class="row"><div class="field"><label>Create password *</label><input id="password" type="password" minlength="8" required><span class="small muted">At least 8 characters; use a unique password.</span></div><div class="field"><label>Area of interest *</label><select id="department" required><option value="">Choose</option><option>App Development</option><option>UI/UX Design</option><option>Web Development</option><option>AI & Emerging Technology</option><option>Content & Community</option><option>Project Coordination</option><option>Other</option></select></div></div><div class="field"><label>Skills and tools</label><input id="skills" maxlength="300" placeholder="HTML, Python, Figma..."></div><div class="field"><label>Portfolio / GitHub / LinkedIn (optional)</label><input id="portfolio" type="url" maxlength="300" placeholder="https://"></div><div class="field"><label>Why would you like to join? *</label><textarea id="motivation" required maxlength="1200"></textarea></div><label class="small muted"><input id="consent" type="checkbox" required style="width:auto"> I agree that NEXUS may use these details to review my application.</label><button id="submit">Create account & submit</button><p id="msg" class="small"></p></form></section></main><script type="module" src="join.js"></script></body></html>
